# Checks a theme or layout submitted through an issue form, previews it, and
# stages it on the `pending` branch for a maintainer's /approve.
#
#   parse  (read)          read the form, decode the payload, check the rules
#   quick  (read)          web store readers + KeyboardMock screenshot, ~1 min
#   stage  (write)         push pending/<issue>/, post the quick sticky comment
#   full   (read)          WM Keyboard's own importer and keyboard on the JVM
#   final  (write)         swap in the JVM preview, final comment and label
#
# The issue body is untrusted. It is read only by bot/src/cli/parse.ts, from
# the event file; no `run:` line below interpolates anything from the issue.
# The render jobs get only the parse job's render-input artifact (request.json
# plus the payload) and hold no write permission; the jobs that write never
# run submitted code.
name: Submission

on:
  issues:
    types: [opened, edited, reopened]
  workflow_dispatch:
    inputs:
      issue:
        description: Issue number to check again (used by /rename)
        required: true

permissions: {}

# Editing the issue cancels the run still going and starts again.
concurrency:
  group: submission-${{ github.event.issue.number || inputs.issue }}
  cancel-in-progress: true

env:
  # The WMKeyboard release both renderers read is picked once, in `parse`:
  # the WMKEYBOARD_REF repository variable when it is set, otherwise the
  # latest release, so a new app release is followed without editing this.
  # `off` skips the JVM pass and lets the quick verdict stand, for a tag that
  # predates AddonShots.
  FULL_RENDER: ${{ vars.FULL_RENDER || 'on' }}
  ISSUE_NUMBER: ${{ github.event.issue.number || inputs.issue }}

jobs:
  parse:
    if: github.event_name == 'workflow_dispatch' || contains(github.event.issue.labels.*.name, 'submission')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      issues: write
    outputs:
      ok: ${{ steps.parse.outputs.ok }}
      id: ${{ steps.parse.outputs.id }}
      type: ${{ steps.parse.outputs.type }}
      ref: ${{ steps.ref.outputs.ref }}
    steps:
      # Resolved here and handed to both render jobs, so a release published
      # mid-run cannot leave the quick and full passes on different versions.
      - name: Pick the WM Keyboard release
        id: ref
        env:
          GH_TOKEN: ${{ github.token }}
          PINNED: ${{ vars.WMKEYBOARD_REF }}
        run: |
          if [ -n "$PINNED" ]; then
            ref="$PINNED"
          else
            ref=$(gh release view --repo wasi-master/wmkeyboard --json tagName --jq .tagName)
          fi
          if [ -z "$ref" ]; then
            echo "::error::No WM Keyboard release to check against"
            exit 1
          fi
          echo "Checking against WM Keyboard $ref"
          echo "ref=$ref" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: bot/package-lock.json

      - name: Install the bot
        working-directory: bot
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Read the submission
        id: parse
        working-directory: bot
        env:
          GITHUB_TOKEN: ${{ github.token }}
          WORK_DIR: ${{ runner.temp }}/work
        run: npx tsx src/cli/parse.ts

      - name: Keep the render input
        if: steps.parse.outputs.ok == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: render-input
          path: ${{ runner.temp }}/work/render/
          retention-days: 7

      - name: Keep the checked form
        if: steps.parse.outputs.ok == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: submission
          path: ${{ runner.temp }}/work/submission.json
          retention-days: 7

  quick:
    needs: parse
    if: needs.parse.outputs.ok == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Check out the web store at the chosen release
        uses: actions/checkout@v4
        with:
          repository: wasi-master/wmkeyboard
          ref: ${{ needs.parse.outputs.ref }}
          path: wmkeyboard
          sparse-checkout: docs/src/store
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: bot/package-lock.json

      - name: Install the bot and a headless browser
        working-directory: bot
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          npx playwright install --with-deps --only-shell chromium

      - uses: actions/download-artifact@v4
        with:
          name: render-input
          path: ${{ runner.temp }}/render

      - name: Validate and draw with the web store
        working-directory: bot
        env:
          STORE_DIR: ${{ github.workspace }}/wmkeyboard/docs/src/store
          RENDER_DIR: ${{ runner.temp }}/render
          OUT_DIR: ${{ runner.temp }}/quick
        run: |
          node quick/build.mjs
          npx tsx quick/run.ts

      - uses: actions/upload-artifact@v4
        with:
          name: quick-output
          path: ${{ runner.temp }}/quick/
          retention-days: 7

  stage:
    needs: [parse, quick]
    # A crashed quick pass still stages the payload, so the try link works and
    # the comment says the web preview is missing.
    if: ${{ !cancelled() && needs.parse.outputs.ok == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
      issues: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: bot/package-lock.json

      - name: Install the bot
        working-directory: bot
        run: npm ci --ignore-scripts --no-audit --no-fund

      - uses: actions/download-artifact@v4
        with:
          name: render-input
          path: ${{ runner.temp }}/work/render

      - uses: actions/download-artifact@v4
        with:
          name: submission
          path: ${{ runner.temp }}/work

      - uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: quick-output
          path: ${{ runner.temp }}/quick

      - name: Stage pending/<issue>
        env:
          GITHUB_TOKEN: ${{ github.token }}
          WORK_DIR: ${{ runner.temp }}/work
          QUICK_DIR: ${{ runner.temp }}/quick
          PENDING_CHECKOUT: ${{ runner.temp }}/pending
        run: |
          bash bot/scripts/branch.sh checkout "$PENDING_CHECKOUT" pending
          (cd bot && npx tsx src/cli/stage.ts files)
          bash bot/scripts/branch.sh commit "$PENDING_CHECKOUT" pending "pending/$ISSUE_NUMBER" "Stage #$ISSUE_NUMBER (quick preview)"

      - name: Post the quick preview
        working-directory: bot
        env:
          GITHUB_TOKEN: ${{ github.token }}
          WORK_DIR: ${{ runner.temp }}/work
          QUICK_DIR: ${{ runner.temp }}/quick
        run: npx tsx src/cli/stage.ts comment --stage quick

  full:
    needs: [parse, stage]
    if: needs.parse.outputs.ok == 'true' && needs.stage.result == 'success' && vars.FULL_RENDER != 'off'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: read
    env:
      WMKB_ENABLE_PLAY_STORE: "false"
      WMKB_ENABLE_GMS: "false"
      GRADLE_OPTS: -Dorg.gradle.jvmargs=-Xmx4g -Dorg.gradle.daemon=false
    steps:
      - name: Check out WM Keyboard at the chosen release
        uses: actions/checkout@v4
        with:
          repository: wasi-master/wmkeyboard
          ref: ${{ needs.parse.outputs.ref }}
          persist-credentials: false

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      # A cold :app compile is the slow part (20+ minutes). The build cache
      # is keyed on the tag, so every later submission against the same tag
      # compiles from cache.
      - name: Restore the Gradle cache for this tag
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ needs.parse.outputs.ref }}

      - name: Cache the Rust engine's host build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: native/wm-engine-jni
          key: ${{ needs.parse.outputs.ref }}

      - uses: actions/download-artifact@v4
        with:
          name: render-input
          path: ${{ runner.temp }}/addon-in

      - name: Import and draw with the app's own code
        continue-on-error: true
        env:
          ADDON_IN: ${{ runner.temp }}/addon-in
          ADDON_OUT: ${{ runner.temp }}/addon-out
        run: |
          mkdir -p "$ADDON_OUT"
          ./gradlew :app:testEnDebugUnitTest \
            -Pwmkb.docShots=true \
            --tests 'com.wasimaster.wmkeyboard.docshots.AddonShots' \
            -Pwmkb.addonShots.in="$ADDON_IN" \
            -Pwmkb.addonShots.out="$ADDON_OUT" \
            -Pkotlin.compiler.execution.strategy=in-process \
            -Pwmkb.skipBenchmarks=true \
            --build-cache --stacktrace

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: full-output
          path: ${{ runner.temp }}/addon-out/
          if-no-files-found: ignore
          retention-days: 7

  final:
    needs: [parse, quick, stage, full]
    if: ${{ !cancelled() && needs.stage.result == 'success' && needs.full.result != 'skipped' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
      issues: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: bot/package-lock.json

      - name: Install the bot
        working-directory: bot
        run: npm ci --ignore-scripts --no-audit --no-fund

      - uses: actions/download-artifact@v4
        with:
          name: render-input
          path: ${{ runner.temp }}/work/render

      - uses: actions/download-artifact@v4
        with:
          name: submission
          path: ${{ runner.temp }}/work

      - uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: quick-output
          path: ${{ runner.temp }}/quick

      - uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: full-output
          path: ${{ runner.temp }}/full

      - name: Swap in the keyboard render
        env:
          GITHUB_TOKEN: ${{ github.token }}
          WORK_DIR: ${{ runner.temp }}/work
          QUICK_DIR: ${{ runner.temp }}/quick
          FULL_DIR: ${{ runner.temp }}/full
          PENDING_CHECKOUT: ${{ runner.temp }}/pending
        run: |
          bash bot/scripts/branch.sh checkout "$PENDING_CHECKOUT" pending
          (cd bot && npx tsx src/cli/stage.ts files)
          bash bot/scripts/branch.sh commit "$PENDING_CHECKOUT" pending "pending/$ISSUE_NUMBER" "Stage #$ISSUE_NUMBER (keyboard render)"

      - name: Post the verdict
        working-directory: bot
        env:
          GITHUB_TOKEN: ${{ github.token }}
          WORK_DIR: ${{ runner.temp }}/work
          QUICK_DIR: ${{ runner.temp }}/quick
          FULL_DIR: ${{ runner.temp }}/full
        run: npx tsx src/cli/stage.ts comment --stage final
