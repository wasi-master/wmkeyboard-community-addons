# Field ids are a contract with the app, which pre-fills this form by query
# string (/issues/new?template=submit-theme.yml&name=…&payload=…), and with the
# bot, which maps the headings back to these ids. Rename a label freely; never
# rename an id.
name: Submit a theme
description: Share a keyboard theme you made in WM Keyboard.
title: "Theme: "
labels: [submission, "type:theme"]
body:
  - type: markdown
    attributes:
      value: |
        The easiest way to fill this in is **Share to community** on your theme in WM Keyboard: it opens this form with everything filled. A bot checks the theme, draws a preview and posts a link to try it before it is published. See [CONTRIBUTING.md](https://github.com/wasi-master/wmkeyboard-community-addons/blob/main/CONTRIBUTING.md).

  - type: input
    id: name
    attributes:
      label: Name
      description: Shown on the theme's card. Up to 60 characters.
      placeholder: Midnight Garden
    validations:
      required: true

  - type: textarea
    id: description
    attributes:
      label: Description
      description: One or two sentences on what it looks like. Up to 500 characters.
    validations:
      required: true

  - type: input
    id: tags
    attributes:
      label: Tags
      description: Comma-separated, up to 8. For example `dark, purple, gradient`.
    validations:
      required: false

  - type: dropdown
    id: license
    attributes:
      label: License
      description: What others may do with it. CC0 gives it away; CC BY asks for credit; CC BY-SA asks remixes to share alike.
      options:
        - CC0-1.0
        - CC-BY-4.0
        - CC-BY-SA-4.0
    validations:
      required: true

  - type: input
    id: updates
    attributes:
      label: Updates
      description: To publish a new version of a theme you shared before, its id (the folder name under addons/themes). Leave empty for a new theme.
    validations:
      required: false

  - type: input
    id: based_on
    attributes:
      label: Based on
      description: Filled in by the app when your theme started from someone else's, as `repo-id/addon-id`. Leave it as it is.
    validations:
      required: false

  - type: textarea
    id: payload
    attributes:
      label: Theme
      description: The `wmkb:1:…` text the app gave you, or drag the `.zip` it saved into this box.
    validations:
      required: true

  - type: checkboxes
    id: rights
    attributes:
      label: Rights
      options:
        - label: I made this, or I have the right to share every image and name in it.
          required: true
