# Field ids are a contract with the app, which pre-fills this form by query
# string (/issues/new?template=submit-sound-pack.yml&name=…&payload=…), and with the
# bot, which maps the headings back to these ids. Rename a label freely; never
# rename an id.
name: Submit a sound pack
description: Share a set of key sounds you recorded or made for WM Keyboard.
title: "Sound pack: "
labels: [submission, "type:sound_pack"]
body:
  - type: markdown
    attributes:
      value: |
        The easiest way to fill this in is **Submit to community** in the web store's sound pack builder. A bot checks the pack and posts a link to try it before it is published. See [CONTRIBUTING.md](https://github.com/wasi-master/wmkeyboard-community-addons/blob/main/CONTRIBUTING.md).

  - type: input
    id: name
    attributes:
      label: Name
      description: Shown on the sound pack's card. Up to 60 characters.
      placeholder: Cream switches
    validations:
      required: true

  - type: textarea
    id: description
    attributes:
      label: Description
      description: "What it sounds like: the keyboard or switch, and how it was recorded. Up to 500 characters."
    validations:
      required: true

  - type: input
    id: tags
    attributes:
      label: Tags
      description: Comma-separated, up to 8. For example `mechanical, thocky, quiet`.
    validations:
      required: false

  - type: dropdown
    id: license
    attributes:
      label: License
      description: What others may do with it. CC0 gives it away; CC BY asks for credit; CC BY-SA asks remixes to share alike.
      options:
        - CC0-1.0
        - CC-BY-4.0
        - CC-BY-SA-4.0
    validations:
      required: true

  - type: input
    id: updates
    attributes:
      label: Updates
      description: To publish a new version of a sound pack you shared before, its id (the folder name under addons/sound-packs). Leave empty for a new one.
    validations:
      required: false

  - type: input
    id: based_on
    attributes:
      label: Based on
      description: Filled in by the app when your sound pack started from someone else's, as `repo-id/addon-id`. Leave it as it is.
    validations:
      required: false

  - type: textarea
    id: payload
    attributes:
      label: Sound pack
      description: Drag the `.zip` holding the pack into this box (a `.wmsoundpack` file renamed to `.zip` works too).
    validations:
      required: true

  - type: checkboxes
    id: rights
    attributes:
      label: Rights
      options:
        - label: I recorded or made every sound in it, or I have the right to share each one under the licence above.
          required: true
